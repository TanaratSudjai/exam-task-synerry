version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tasK_exam
      MYSQL_DATABASE: exam_task_synerry
      MYSQL_USER: exam_task_synerry
      MYSQL_PASSWORD: tasK_exam
    ports:
      - "3366:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: